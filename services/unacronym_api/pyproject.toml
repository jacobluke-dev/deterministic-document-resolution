[tool.poetry]
name = "unacronym-api"
version = "0.1.0"
description = "Public API for Unacronym"
authors = ["Jacob Bickerstaff"]
packages = [{ include = "src/public_api"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.116.1"
starlette = ">=0.40.0,<0.48.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.1"
SQLAlchemy = ">=2.0.43,<2.1"
psycopg = { version = ">=3.2,<3.3", extras = ["binary"] }
alembic = ">=1.16.5,<2.0"
httpx = "^0.28.1"
testcontainers = "^4.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
mypy = "^1.11.1"
ruff = "^0.5.7"
pytest-asyncio = "^0.23.8"
httpx = "^0.28.1"
pytest-cov = "^5.0.0"
testcontainers = { extras = ["postgresql"], version = "^4.12.0" }
types-requests = "^2.32.4.20250809"
types-PyYAML = "^6.0.12"
pre-commit = "^4.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
