[tool.poetry]
name = "public-api"
version = "0.1.0"
description = "Public API service for UnAcronym"
authors = ["Jacob Bickerstaff"]
packages = [{ include = "public_api", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
plainera-core = { path = "../../packages/plainera_core", develop = true }
plainera-observability = { path = "../../packages/plainera_observability", develop = true, extras = ["fastapi"] }
fastapi = "^0.115.0"
starlette = ">=0.40.0,<0.48.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.1"
SQLAlchemy = "^2.0"
psycopg = {version = ">=3.1", extras = ["binary"]}
alembic = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
mypy = "^1.11.1"
ruff = "^0.5.7"
pytest-asyncio = "^0.23.8"
httpx = "^0.27.0"
pytest-cov = "^5.0.0"
testcontainers = {extras = ["postgresql"], version = "^4.12.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "UP", "B", "PERF", "ASYNC"]


[tool.pytest.ini_options]
addopts = "-q --asyncio-mode=auto --cov=public_api --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=80"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
