[pytest]
# Constrain collection to *this* package's tests only
testpaths =
    services/document_resolution_api/tests

# Standard discovery rules
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    -p test_kit.fixtures
    --cov=public_api
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --ignore=/usr/lib/python*/test
    --ignore-glob=**/Lib/test/**

markers =
    unit: fast, isolated, no I/O
    integration: full-stack tests using real app, DB, and migrations
    e2e: end-to-end tests
    migrations: Alembic migration tests


# stop recursing into junk dirs
norecursedirs = .venv venv .git node_modules build dist __pycache__

pythonpath =
    services/document_resolution_api/src
