# mypy.ini
# ============================
# Global mypy configuration
# ============================

[mypy]
# Target Python version – makes mypy aware of syntax and stdlib features up to 3.13
python_version = 3.13

# Warn if a setting in mypy.ini that mypy doesn’t recognize.
# Helps catch typos like `warn_unusd_ignores`.
warn_unused_configs = True

# ----------------------------------------------------------
# Strictness flags
# ----------------------------------------------------------

# Enables a bundle of strict flags: requires type hints on functions,
# disallows incomplete signatures, and checks untyped calls.
strict = True

# Forces to explicitly write Optional[...] instead of assuming
# e.g. `def foo(x: str = None)` is `Optional[str]`.
no_implicit_optional = True

# Check `==` and `!=` operators – e.g. comparing int to str will error.
strict_equality = True

# Disallow untyped external libraries (those without type stubs).
# If a library is missing types, mypy will complain instead of
# silently falling back to `Any`.
disallow_any_unimported = True

disallow_untyped_defs = True

# Flag if a function returns `Any` type unintentionally.
warn_return_any = True

# Warn to leave behind unused `# type: ignore` comments.
warn_unused_ignores = True

# Warn if write `cast()` that has no effect.
warn_redundant_casts = True

# Warn about obviously unreachable code (e.g. code after `return`).
warn_unreachable = True

# TEMPORARY ESCAPE HATCH:
# If use libraries without stubs, flip this on so mypy
# doesn’t block. I can later add stub packages
# (e.g. `types-requests`, `types-PyYAML`) and turn this off.
ignore_missing_imports = True

# ----------------------------------------------------------
# Framework plugins
# ----------------------------------------------------------

# These give better type inference for frameworks.
# Remove them if not using FastAPI/Pydantic or SQLAlchemy.
plugins = pydantic.mypy, sqlalchemy.ext.mypy.plugin

mypy_path = src
explicit_package_bases = True
packages = public_api

follow_imports = normal
# (optional) quiet noisy deps:
# [mypy-sqlalchemy.*]
# ignore_missing_imports = True


# ============================
# Per-module overrides
# ============================

[mypy-tests.*]
# Relax rules for test files (pytest functions usually lack type hints).
disallow_untyped_defs = False
check_untyped_defs = False
