version: "3.9"

services:
  api:
    build:
      context: ..                                 # repo root
      dockerfile: services/unacronym_api/Dockerfile  # path is relative to context
    working_dir: /app
    env_file: ./.env
    ports: [ "8000:8000" ]
    volumes:
      - ./unacronym_api/alembic.ini:/app/unacronym_api/alembic.ini:ro
      - ./unacronym_api/migrations:/app/unacronym_api/migrations
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unacronym}
      POSTGRES_USER: ${POSTGRES_USER:-unacronym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # keep host port closed by default to avoid collisions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unacronym} -d ${POSTGRES_DB:-unacronym}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
