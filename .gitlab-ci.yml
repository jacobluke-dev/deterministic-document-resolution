# Pipelines only for non-draft MRs and default branch
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"  # draft MR
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"                                       # non-draft MR
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH                                            # default branch
    - when: never

stages: [ core ]

variables:
  ENVIRONMENT: "CI"
  POETRY_VERSION: "1.8.3"
  # Use a single in-project venv at repo root
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - .cache/pypoetry
    - .venv  # speeds subsequent jobs

# ---------- common before_script (copy into each job) ----------
# Note: we do NOT call `poetry env use` anymore.
.before-poetry: &before-poetry
  before_script:
    - python --version
    - pip install "poetry==$POETRY_VERSION"
    - poetry install --with dev
    - export VENV_BIN="$(poetry env info --path)/bin"

core:
  stage: core
  image: python:3.13
  services:
    - name: postgres:15-alpine
      alias: db
      command: [ "postgres", "-c", "log_statement=none" ]
  variables:
    POETRY_VERSION: "1.8.3"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    POETRY_VIRTUALENVS_IN_PROJECT: "true"
    # Point tests at the job-local DB so testcontainers is NOT used
    TEST_DB_URL: "postgresql+psycopg://unacronym:test-password@db:5432/unacronym"
    POSTGRES_DB: "unacronym"
    POSTGRES_USER: "unacronym"
    POSTGRES_PASSWORD: "test-password"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never
  before_script:
    - python --version
    - pip install "poetry==$POETRY_VERSION"
    - poetry install --with dev
    - export VENV_BIN="$(poetry env info --path)/bin"
  script:
    # Wait for the DB (TCP probe; no psycopg import needed)
    - |
      "$VENV_BIN/python" - <<'PY'
      import socket, time, sys
      host, port = "db", 5432
      for _ in range(60):
          try:
              with socket.create_connection((host, port), timeout=2):
                  sys.exit(0)
          except OSError:
              time.sleep(1)
      print("DB not ready in time", file=sys.stderr); sys.exit(2)
      PY
    - make -C packages/plainera_core lint      RUN="$VENV_BIN/python -m"
    - make -C packages/plainera_core typecheck RUN="$VENV_BIN/python -m"
    - make -C packages/plainera_core test      RUN="$VENV_BIN/python -m"
  artifacts:
    when: always
    paths:
      - packages/plainera_core/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/plainera_core/coverage.xml
    expire_in: 1 week

unacronym:
  stage: core
  image: python:3.13
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/plainera_unacronym/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - packages/plainera_unacronym/**/*
    - when: never
  <<: *before-poetry
  script:
    - make -C packages/plainera_unacronym lint      RUN="$VENV_BIN/python -m"
    - make -C packages/plainera_unacronym typecheck RUN="$VENV_BIN/python -m"
    - make -C packages/plainera_unacronym test      RUN="$VENV_BIN/python -m"
  artifacts:
    when: always
    paths:
      - packages/plainera_unacronym/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/plainera_unacronym/coverage.xml
    expire_in: 1 week

observability:
  stage: core
  image: python:3.13
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/plainera_observability/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - packages/plainera_observability/**/*
    - when: never
  <<: *before-poetry
  script:
    - make -C packages/plainera_observability lint      RUN="$VENV_BIN/python -m"
    - make -C packages/plainera_observability typecheck RUN="$VENV_BIN/python -m"
    - make -C packages/plainera_observability test      RUN="$VENV_BIN/python -m"
  artifacts:
    when: always
    paths:
      - packages/plainera_observability/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/plainera_observability/coverage.xml
    expire_in: 1 week

api:
  stage: core
  image: python:3.13
  services:
    - name: postgres:15-alpine
      alias: db
      command: [ "postgres", "-c", "log_statement=none" ]
  variables:
    POSTGRES_DB: "unacronym"
    POSTGRES_USER: "unacronym"
    POSTGRES_PASSWORD: "test-password"
    DATABASE_URL: "postgresql+psycopg://unacronym:test-password@db:5432/unacronym"
    APP_ENV: "test"
    AUTH_DISABLED: "false"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - services/unacronym_api/**/*
        - packages/plainera_core/**/*
        - packages/plainera_observability/**/*
        - packages/plainera_testkit/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - services/unacronym_api/**/*
        - packages/plainera_core/**/*
        - packages/plainera_observability/**/*
        - packages/plainera_testkit/**/*
    - when: never
  <<: *before-poetry
  script:
    # Wait for Postgres (TCP only: no deps required)
    - |
      "$VENV_BIN/python" - <<'PY'
      import socket, time, sys
      host, port = "db", 5432
      for i in range(60):
          try:
              with socket.create_connection((host, port), timeout=2):
                  print("DB is accepting TCP connections")
                  sys.exit(0)
          except OSError:
              time.sleep(1)
      print("DB not ready in time", file=sys.stderr)
      sys.exit(2)
      PY

    # Run service steps inside the service dir
    - |
      cd services/unacronym_api
      "$VENV_BIN/python" -m alembic -c alembic.ini upgrade head
      make lint      RUN="$VENV_BIN/python -m"
      make typecheck RUN="$VENV_BIN/python -m"
      make test      RUN="$VENV_BIN/python -m"
  artifacts:
    when: always
    paths:
      - services/unacronym_api/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: services/unacronym_api/coverage.xml
    expire_in: 1 week
