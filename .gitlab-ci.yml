observability:
  stage: core
  image: python:3.13
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/document_resolution_observability/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - packages/document_resolution_observability/**/*
    - when: never
  <<: *before-poetry
  script:
    - make -C packages/document_resolution_observability lint      RUN="$VENV_BIN/python -m"
    - make -C packages/document_resolution_observability typecheck RUN="$VENV_BIN/python -m"
    - make -C packages/document_resolution_observability test      RUN="$VENV_BIN/python -m"
  artifacts:
    when: always
    paths:
      - packages/document_resolution_observability/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/document_resolution_observability/coverage.xml
    expire_in: 1 week
api:
  stage: core
  image: python:3.13
  services:
    - name: postgres:15-alpine
      alias: db
      command: [ "postgres", "-c", "log_statement=none" ]
  variables:
      POSTGRES_DB: "document_resolution"
      POSTGRES_USER: "document_resolution"
      POSTGRES_PASSWORD: "test-password"

      # Alembic must use sync URL
      DATABASE_URL: "postgresql+psycopg://document_resolution:test-password@db:5432/document_resolution"

      # For packages that insist on both being present
      DATABASE_URL_SYNC: "postgresql+psycopg://document_resolution:test-password@db:5432/document_resolution"
      TEST_DB_URL: "postgresql+psycopg://document_resolution:test-password@db:5432/document_resolution"

      # Optional: if your app/tests want an async URL, provide it separately
      DATABASE_URL_ASYNC: "postgresql+asyncpg://document_resolution:test-password@db:5432/document_resolution"

      APP_ENV: "test"
      DATABASE_DISABLED: "false"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - services/document_resolution_api/**/*
        - packages/document_resolution_core/**/*
        - packages/document_resolution_observability/**/*
        - packages/document_resolution_testkit/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - services/document_resolution_api/**/*
        - packages/document_resolution_core/**/*
        - packages/document_resolution_observability/**/*
        - packages/document_resolution_testkit/**/*
    - when: never
  <<: *before-poetry
  script:
    # Wait for Postgres (TCP only: no deps required)
    - |
      "$VENV_BIN/python" - <<'PY'
      import socket, time, sys
      host, port = "db", 5432
      for i in range(60):
          try:
              with socket.create_connection((host, port), timeout=2):
                  print("DB is accepting TCP connections")
                  sys.exit(0)
          except OSError:
              time.sleep(1)
      print("DB not ready in time", file=sys.stderr)
      sys.exit(2)
      PY

    # Run service steps inside the service dir
    - |
      cd services/document_resolution_api
      "$VENV_BIN/python" -m alembic -c alembic.ini upgrade head
      make lint      RUN="$VENV_BIN/python -m"
      make typecheck RUN="$VENV_BIN/python -m"
      make test      RUN="$VENV_BIN/python -m"
  artifacts:
    when: always
    paths:
      - services/document_resolution_api/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: services/document_resolution_api/coverage.xml
    expire_in: 1 week
web:
  stage: core
  image: node:20-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/documentResolutionWeb/**/*
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/documentResolutionWeb/**/*
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
    - when: never
  variables:
    NODE_ENV: "production"
    # Build-time public env required by your build validation:
    NEXT_PUBLIC_API_BASE_URL: "http://api.document_resolution.dev"  # or staging URL
    NEXT_PUBLIC_ENV: "staging"
    NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
  before_script:
    - node --version
    - corepack enable
    - pnpm --version
    - pnpm config set store-dir "$PNPM_STORE_DIR"
  script:
    - pnpm -C apps/documentResolutionWeb install --frozen-lockfile
    - pnpm -C apps/documentResolutionWeb lint
    - pnpm -C apps/documentResolutionWeb exec tsc -p tsconfig.json --noEmit
    - pnpm -C apps/documentResolutionWeb test
    - pnpm -C apps/documentResolutionWeb build
