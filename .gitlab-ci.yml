# Pipelines only for non-draft MRs and default branch
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"  # draft MR
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"                                       # non-draft MR
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH                                            # default branch
    - when: never
default:
  tags:
    - local
    - docker
stages: [ core ]

variables:
  ENVIRONMENT: "CI"
  POETRY_VERSION: "1.8.3"
  # Use a single in-project venv at repo root
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"
cache:
  policy: pull-push
  key:
    files:
      - poetry.lock
  paths:
    - .cache/pip
    - .cache/pypoetry

# ---------- common before_script (copy into each job) ----------
# Note: we do NOT call `poetry env use` anymore.
.before-poetry: &before-poetry
  before_script:
    - python --version
    - pip install "poetry==$POETRY_VERSION"
    - poetry config cache-dir "$POETRY_CACHE_DIR"
    - poetry install --with dev --without ml -vvv --sync
    - git diff --exit-code poetry.lock
    - export VENV_BIN="$(poetry env info --path)/bin"

core:
  stage: core
  image: python:3.13
  services:
    - name: postgres:15-alpine
      alias: db
      command: [ "postgres", "-c", "log_statement=none" ]
  variables:
    POETRY_VERSION: "1.8.3"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    POETRY_VIRTUALENVS_IN_PROJECT: "true"
    # Point tests at the job-local DB so testcontainers is NOT used
    TEST_DB_URL: "postgresql+psycopg://document_resolution:test-password@db:5432/document_resolution"
    POSTGRES_DB: "document_resolution"
    POSTGRES_USER: "document_resolution"
    POSTGRES_PASSWORD: "test-password"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/document_resolution_core/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - packages/document_resolution_core/**/*
        - poetry.lock
        - pyproject.toml
        - .gitlab-ci.yml
    - when: never
  before_script:
    - python --version
    - pip install "poetry==$POETRY_VERSION"
    - poetry config cache-dir "$POETRY_CACHE_DIR"
    - poetry install --with dev --without ml -vvv --sync
    - git diff --exit-code poetry.lock
    - export VENV_BIN="$(poetry env info --path)/bin"
  script:
    # Wait for the DB (TCP probe; no psycopg import needed)
    - |
      "$VENV_BIN/python" - <<'PY'
      import socket, time, sys
      host, port = "db", 5432
      for _ in range(60):
          try:
              with socket.create_connection((host, port), timeout=2):
                  sys.exit(0)
          except OSError:
              time.sleep(1)
      print("DB not ready in time", file=sys.stderr); sys.exit(2)
      PY
    - make -C packages/document_resolution_core lint      RUN="$VENV_BIN/python -m"
    - make -C packages/document_resolution_core typecheck RUN="$VENV_BIN/python -m"
    - make -C packages/document_resolution_core test      RUN="$VENV_BIN/python -m"
  artifacts:
    when: always
    paths:
      - packages/document_resolution_core/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/document_resolution_core/coverage.xml
    expire_in: 1 week

document_resolution:
  stage: core
  image: python:3.13
  services:
    - name: postgres:15-alpine
      alias: db
      command: [ "postgres", "-c", "log_statement=none" ]
  variables:
    POETRY_VERSION: "2.1.4"
    POETRY_VIRTUALENVS_IN_PROJECT: "true"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    # Single source for DB; use it for sync
    TEST_DB_URL: "postgresql+psycopg://document_resolution:test-password@db:5432/document_resolution"
    POSTGRES_DB: "document_resolution"
    POSTGRES_USER: "document_resolution"
    POSTGRES_PASSWORD: "test-password"
    # What composition.py expects:
    DATABASE_URL_SYNC: "$TEST_DB_URL"
    DATABASE_URL: "postgresql+asyncpg://document_resolution:test-password@db:5432/document_resolution"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/document_resolution/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - packages/document_resolution/**/*
        - poetry.lock
        - pyproject.toml
        - .gitlab-ci.yml
    - when: never
  before_script:
    - python --version
    - pip install "poetry==$POETRY_VERSION"
    - poetry config cache-dir "$POETRY_CACHE_DIR"
    - poetry install --with dev --without ml -vvv --sync
    - git diff --exit-code poetry.lock
    - export VENV_BIN="$(poetry env info --path)/bin"
    # Wait for DB to be ready
    - |
      "$VENV_BIN/python" - <<'PY'
      import socket, time, sys
      for _ in range(60):
          try:
              with socket.create_connection(("db", 5432), timeout=2):
                  sys.exit(0)
          except OSError:
              time.sleep(1)
      print("DB not ready in time", file=sys.stderr); sys.exit(2)
      PY
  script:
    - make -C packages/document_resolution lint      RUN="$VENV_BIN/python -m"
    - make -C packages/document_resolution typecheck RUN="$VENV_BIN/python -m"
    - make -C packages/document_resolution test      RUN="$VENV_BIN/python -m"
  artifacts:
    when: always
    paths:
      - packages/document_resolution/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/document_resolution/coverage.xml
    expire_in: 1 week

