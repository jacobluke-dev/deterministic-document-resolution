[tool.poetry]
name = "plainera-monorepo"
version = "0.1.0"
description = "Plainera mono-repo: dev tooling and orchestration"
authors = ["Jacob Bickerstaff"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.116.2"
starlette = ">=0.47.3,<0.48.0"
uvicorn = { extras = ["standard"], version = "^0.30.6" }
pydantic-settings = "^2.13.1"
python-dotenv = "^1.1.1"
SQLAlchemy = ">=2.0.48,<2.1"
psycopg = { version = ">=3.2.13,<3.3.0", extras = ["binary"] }
alembic = ">=1.18.4,<2.0"
httpx = "^0.28.1"
asyncpg = "^0.30.0"
numpy = "^2.4.2"
reportlab = "^4.4.10"
openai = ">=1,<2"

plainera-core = { path = "packages/document_resolution_core", develop = true }
document-resolution = { path = "packages/document_resolution", develop = true }
plainera-rag-demo = { path = "packages/plainera_rag_demo", develop = true }
plainera-testkit = { path = "packages/document_resolution_testkit", develop = true }
plainera-observability = { path = "packages/document_resolution_observability", develop = true, extras = ["fastapi"] }
document-resolution-api = { path = "services/document_resolution_api", develop = true }


# -----------------------
# Optional groups
# -----------------------

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
torch = { version = "^2.10.0", markers = "python_version < '3.15'" }
transformers = { version = "^5.2.0", markers = "python_version < '3.15'" }
sentence-transformers = { version = "^5.2.3", markers = "python_version < '3.15'" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^0.23.8"
pytest-cov = "^5.0.0"
mypy = "^1.19.1"
ruff = "^0.5.7"
pre-commit = "^4.3.0"
behave = "^1.3.2"
build = "^1.3.0"
testcontainers = { extras = ["postgresql"], version = "^4.12.0" }
types-requests = "^2.32.4.20250809"
types-PyYAML = "^6.0.12.20250822"
jupyterlab = "^4.5.5"
ipykernel = "^7.2.0"
faiss-cpu = ">=1.9,<2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- Pytest configuration ---
[tool.pytest.ini_options]
addopts = "-q --asyncio-mode=auto --cov=public_api --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=80"

# --- Mypy configuration ---
[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true
explicit_package_bases = true

# --- Ruff configuration ---
[tool.ruff]
line-length = 120
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/conftest.py" = ["E402", "F401"]

# --- Poetry Extras ---
[tool.poetry.extras]
fastapi = ["fastapi"]
