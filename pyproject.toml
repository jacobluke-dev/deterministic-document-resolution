# pyproject.toml (repo root)
[tool.poetry]
name = "plainera-monorepo"
version = "0.1.0"
description = "Plainera mono-repo: dev tooling and orchestration"

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.7"
mypy = "^1.11.1"
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
types-requests = "^2.32.0.20240712"
types-PyYAML = "^6.0.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
