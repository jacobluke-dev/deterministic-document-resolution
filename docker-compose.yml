services:
  api:
    environment:
      DB_HOST: db
      DATABASE_URL: postgresql+psycopg://document_resolution:test-password@db:5432/document_resolution
      DATABASE_URL_SYNC: postgresql+psycopg://document_resolution:test-password@db:5432/document_resolution
      DATABASE_URL_ASYNC: postgresql+asyncpg://document_resolution:test-password@db:5432/document_resolution
      WATCHFILES_FORCE_POLLING: "true"
    build:
      context: .
      dockerfile: services/document_resolution_api/Dockerfile
    env_file: ./.env
    working_dir: /app/services/document_resolution_api
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/document_resolution_api/alembic.ini:/app/services/document_resolution_api/alembic.ini:ro
      - ./services/document_resolution_api/migrations:/app/services/document_resolution_api/migrations
      - ./services/document_resolution_api/src:/app/src
      - ./packages/document_resolution:/app/packages/document_resolution
      - ./packages/document_resolution_core:/app/packages/document_resolution_core
      - ./packages/document_resolution_observability:/app/packages/document_resolution_observability
    command:
      [
        "uvicorn",
        "--app-dir", "/app/src",
        "public_api.main:create_app",
        "--factory",
        "--host", "0.0.0.0",
        "--port", "8000",
        "--reload",
        "--reload-dir", "/app/src",
        "--reload-dir", "/app/packages/document_resolution/src",
        "--reload-dir", "/app/packages/document_resolution_core/src",
        "--reload-dir", "/app/packages/document_resolution_observability/src"
      ]
  web:
    build:
      context: .
      dockerfile: apps/documentResolutionWeb/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:8000}
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-local}
        NEXT_PUBLIC_ENABLE_ANALYTICS: ${NEXT_PUBLIC_ENABLE_ANALYTICS:-false}
    environment:
      DOCUMENT_RESOLUTION_API_KEY: ${DOCUMENT_RESOLUTION_API_KEY:-devkey}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/documentResolutionWeb:/repo/apps/documentResolutionWeb
      - web_node_modules:/repo/apps/documentResolutionWeb/node_modules
    ports:
      - "3001:3000"
    depends_on:
      - api

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-document_resolution}
      POSTGRES_USER: ${POSTGRES_USER:-document_resolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test-password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-document_resolution} -d ${POSTGRES_DB:-document_resolution}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
  web_node_modules:
