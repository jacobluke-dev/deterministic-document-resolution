services:
  api:
    environment:
      DB_HOST: localhost
      DATABASE_URL: postgresql+psycopg://unacronym:test-password@db:5432/unacronym
      DATABASE_URL_SYNC: postgresql+psycopg://unacronym:test-password@db:5432/unacronym
      DATABASE_URL_ASYNC: postgresql+asyncpg://unacronym:test-password@db:5432/unacronym
      WATCHFILES_FORCE_POLLING: "true"
    build:
      context: .
      dockerfile: services/unacronym_api/Dockerfile
    env_file: ./.env
    working_dir: /app/services/unacronym_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/unacronym_api/alembic.ini:/app/services/unacronym_api/alembic.ini:ro
      - ./services/unacronym_api/migrations:/app/services/unacronym_api/migrations
      - ./services/unacronym_api/src:/app/src
    command: [ "uvicorn", "--app-dir", "/app/src", "public_api.main:create_app", "--factory",
               "--host", "0.0.0.0", "--port", "8000",
               "--reload", "--reload-dir", "/app/src" ]

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unacronym}
      POSTGRES_USER: ${POSTGRES_USER:-unacronym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"          # optional; can remove to keep DB private to the network
    volumes:
      - pgdata:/var/lib/postgresql/data
    # keep host port closed by default to avoid collisions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unacronym} -d ${POSTGRES_DB:-unacronym}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
