version: "3.9"

services:
  api:
    build:
      context: .                               # repo root
      dockerfile: services/unacronym_api/Dockerfile
    env_file: ./.env
    working_dir: /app
    ports:
      - "8000:8000"                            # host:container
    depends_on:
      db:
        condition: service_healthy
    # If you want live-reload for alembic files during dev:
    volumes:
      - ./services/unacronym_api/alembic.ini:/app/unacronym_api/alembic.ini:ro
      - ./services/unacronym_api/migrations:/app/unacronym_api/migrations

  plainera_unacronym:
    build:
      context: .                               # repo root
      dockerfile: packages/plainera_unacronym/Dockerfile
    env_file: ./.env
    working_dir: /app
    environment:
      - PORT=8000
    ports:
      - "8001:8000"                            # different host port than api
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unacronym}
      POSTGRES_USER: ${POSTGRES_USER:-unacronym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"          # optional; can remove to keep DB private to the network
    volumes:
      - pgdata:/var/lib/postgresql/data
    # keep host port closed by default to avoid collisions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unacronym} -d ${POSTGRES_DB:-unacronym}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
