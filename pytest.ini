# pytest.ini
[pytest]


testpaths =
    services/unacronym_api/tests
    packages/plainera_core/tests
    packages/plainera_observability/tests
    packages/plainera_unacronym/tests

# Discovery rules
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Quiet, deterministic output by default (PyCharm can override on the Run/Debug config)
addopts = -q -p no:plainera_testkit

# Use pytest-asyncio, this avoids strict-mode surprises with normal fixtures
asyncio_mode = auto

# Register markers you use to avoid "unknown marker" warnings
markers =
    anyio: run with anyio event loop
    slow: slow tests
    integration: integration tests (db/network)
    db: database tests

# Keep noise down
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
