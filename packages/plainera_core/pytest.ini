[pytest]

testpaths =
    packages/plainera_core/tests

# Discovery rules
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --cov=plainera_core
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --ignore=/usr/lib/python*/test
    --ignore-glob=**/Lib/test/**

# stop recursing into junk dirs
norecursedirs = .venv venv .git node_modules build dist __pycache__
