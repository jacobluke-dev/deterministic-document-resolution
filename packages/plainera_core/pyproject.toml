# packages/plainera_core/pyproject.toml
[tool.poetry]
name = "plainera-core"
version = "0.1.0"
description = "Plainera Core Package"
authors = ["Jacob Bickerstaff"]

packages = [
  { include = "core" },
  { include = "db_manager" }
]

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
mypy = "^1.11.1"
ruff = "^0.5.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
