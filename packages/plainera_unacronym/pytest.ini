[pytest]
# Constrain collection to *this* package's tests only
testpaths =
    packages/plainera_unacronym/tests

# Standard discovery rules
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --cov=plainera_unacronym
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --ignore=/usr/lib/python*/test
    --ignore-glob=**/Lib/test/**

# stop recursing into junk dirs
norecursedirs = .venv venv .git node_modules build dist __pycache__

pythonpath =
    packages/plainera_unacronym/src
