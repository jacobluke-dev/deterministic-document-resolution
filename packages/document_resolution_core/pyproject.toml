# packages/document_resolution_core/pyproject.toml
[tool.poetry]
name = "plainera-core"
version = "0.1.0"
description = "Plainera Core Package"
authors = ["Jacob Bickerstaff"]

packages = [{ include = "document_resolution_core", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
SQLAlchemy = ">=2.0.43,<2.1"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
plainera-testkit = { path = "../plainera_testkit", develop = true }
pytest = "^8.3.0"
mypy = "^1.11.1"
ruff = "^0.5.7"
pytest-asyncio = "^1.1.0"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# --- Ruff configuration ---
[tool.ruff]
line-length = 120
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]
fixable = ["ALL"]
