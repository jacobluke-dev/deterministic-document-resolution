[pytest]

testpaths =
    packages/document_resolution_rag_demo/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --cov=document_resolution_rag_demo
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --ignore=/usr/lib/python*/test
    --ignore-glob=**/Lib/test/**

markers =
    unit: fast, isolated, no I/O
    integration: DB or external systems
    e2e: end-to-end tests
    migrations: Alembic migration tests
    anyio: run async tests with AnyIO


norecursedirs = .venv venv .git node_modules build dist __pycache__

pythonpath =
    packages/document_resolution_rag_demo/src
