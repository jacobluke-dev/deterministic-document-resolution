[tool.poetry]
name = "document-resolution"
version = "0.1.0"
description = "document resolution product library (detector + heuristics)"
authors = ["Jacob Bickerstaff"]

packages = [{ include = "document_resolution", from = "src" }]

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
sentence-transformers = { version = "^5.2.3", markers = "python_version < '3.15'" }

[tool.poetry.dependencies]
python = "^3.13"
SQLAlchemy = ">=2.0.43,<2.1"
python-dotenv = "^1.0"
document-resolution-observability = { path = "../document_resolution_observability", develop = true }
numpy="2.4.2"


[tool.poetry.group.dev.dependencies]
document-resolution-testkit = { path = "../document_resolution_testkit", develop = true }
pytest = "^8.3.0"
mypy = "^1.11.1"
ruff = "^0.5.7"
pytest-asyncio = "^1.1.0"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- Ruff configuration ---
[tool.ruff]
line-length = 120
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "TID"]
fixable = ["ALL"]

[tool.pytest.ini_options]
pythonpath = ["src"]
