[tool.poetry]
name = "plainera-rag-demo"
version = "0.1.0"
description = "RAG demonstrator package for baseline and grounded retrieval experiments"
authors = ["Jacob Bickerstaff"]

packages = [{ include = "plainera_rag_demo", from = "src" }]

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
sentence-transformers = { version = "^5.2.3", markers = "python_version < '3.15'" }

[tool.poetry.dependencies]
python = "^3.13"
python-dotenv = "^1.0"
SQLAlchemy = ">=2.0.43,<2.1"
plainera-observability = { path = "../plainera_observability", develop = true }
numpy = "2.4.2"
openai = ">=1,<2"

[tool.poetry.group.dev.dependencies]
plainera-testkit = { path = "../plainera_testkit", develop = true }
pytest = "^8.3.0"
mypy = "^1.11.1"
ruff = "^0.5.7"
pytest-asyncio = "^1.1.0"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "TID"]
fixable = ["ALL"]

[tool.pytest.ini_options]
pythonpath = ["src"]
