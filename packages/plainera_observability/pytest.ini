[pytest]

testpaths =
    packages/plainera_observability/tests

# Discovery rules
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --cov=observability
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --ignore=/usr/lib/python*/test
    --ignore-glob=**/Lib/test/**

markers =
    unit: fast, isolated, no I/O
    integration: DB or external systems
    e2e: end-to-end tests
    migrations: Alembic migration tests

# stop recursing into junk dirs
norecursedirs = .venv venv .git node_modules build dist __pycache__

pythonpath =
    packages/plainera_observability/src
