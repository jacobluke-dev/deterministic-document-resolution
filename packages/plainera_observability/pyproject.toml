[tool.poetry]
name = "plainera-observability"
version = "0.1.0"
description = "Observability package for Plainera"
authors = ["Jacob Bickerstaff <jacob.bickerstaff@plainera.com>"]
packages = [{ include = "plainera_observability" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.116.1"
starlette = ">=0.40.0,<0.48.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.8"
mypy = "^1.11.1"
ruff = "^0.5.7"
pytest-cov = "^6.2.1"
pre-commit = "^4.3.0"
httpx = "^0.28.1"
types-requests = "^2.32.4.20250809"

[tool.poetry.extras]
fastapi = ["fastapi"]


[tool.pytest.ini_options]
addopts = "-q --asyncio-mode=auto --cov=public_api --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=80"
pythonpath = ["src"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true
explicit_package_bases = true
